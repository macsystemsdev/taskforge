name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: Testing
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug
          extensions: mbstring, bcmath, intl, xml, pdo, pdo_sqlite, sqlite3, zip, curl

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Debug PHP environment
        run: |
          php -v
          php -m
          php -r "echo 'pdo: ' . (extension_loaded('pdo') ? 'yes' : 'no') . PHP_EOL;"
          php -r "echo 'pdo_sqlite: ' . (extension_loaded('pdo_sqlite') ? 'yes' : 'no') . PHP_EOL;"
          php -r "echo 'sqlite3: ' . (extension_loaded('sqlite3') ? 'yes' : 'no') . PHP_EOL;"
          php -r "echo 'intl: ' . (extension_loaded('intl') ? 'yes' : 'no') . PHP_EOL;"
          php artisan --version || true

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Configure Testing Environment
        run: |
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "CACHE_STORE=array" >> .env

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: |
          COMPOSER_MEMORY_LIMIT=-1 composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Discover Packages
        run: php artisan package:discover --ansi

      - name: Publish Filament Assets
        run: php artisan filament:upgrade --ansi

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Install Node Dependencies
        run: npm i

      - name: Build Assets
        run: npm run build

      - name: Run Tests
        run: ./vendor/bin/pest
