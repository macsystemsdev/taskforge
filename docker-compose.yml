services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}

    image: taskforge:latest
    container_name: taskforge-app
    restart: unless-stopped
    command: php artisan serve --host=0.0.0.0 --port=8000

    ports:
      - "8000:8000"


    env_file:
      - .env

    environment:
      DB_HOST: host.docker.internal
      REDIS_HOST: redis

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - redis

  horizon:
    image: taskforge:latest
    container_name: taskforge-horizon
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      REDIS_HOST: redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  scheduler:
    image: taskforge:latest
    container_name: taskforge-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      REDIS_HOST: redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  reverb:
    image: taskforge:latest
    container_name: taskforge-reverb
    restart: unless-stopped
    command: php artisan reverb:start
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      REDIS_HOST: redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: taskforge-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data: